services:
  - type: web
    name: por-boas-historias
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL   # Postgres do Supabase (pooler, modo sessão)
        sync: false
      - key: DB_SCHEMA
        value: pbh
      - key: ADMIN_EMAIL     # primeiro administrador (criado se não houver usuários)
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD  # senha temporária; trocada no primeiro acesso
        sync: false
      - key: SESSION_SECRET
        generateValue: true
